<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cetak QR Code Siswa - Aisyah Cendekia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0f2044; --navy-mid: #1a3460; --blue: #2563eb;
      --gold: #f59e0b; --gold-light: #fcd34d; --green: #10b981;
      --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
      --gray-400: #94a3b8; --gray-600: #475569; --gray-800: #1e293b;
      --shadow: 0 4px 24px rgba(15,32,68,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gray-50); color: var(--gray-800); }

    /* ===== HEADER ===== */
    header { background: linear-gradient(135deg, var(--navy), var(--navy-mid)); color: white; padding: 18px 24px; display: flex; align-items: center; gap: 14px; }
    .logo { width: 48px; height: 48px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .header-info h1 { font-size: 15px; font-weight: 800; }
    .header-info p { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 2px; }

    /* ===== KONTROL ===== */
    .controls { background: white; border-bottom: 1px solid var(--gray-200); padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .controls-left { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; }
    .btn { padding: 10px 18px; border: none; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 6px; }
    .btn-primary { background: linear-gradient(135deg, var(--blue), #3b82f6); color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.25); }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-print { background: linear-gradient(135deg, var(--navy), var(--navy-mid)); color: white; box-shadow: 0 4px 12px rgba(15,32,68,0.25); }
    .btn-print:hover { transform: translateY(-1px); }
    .btn-outline { background: white; color: var(--navy); border: 2px solid var(--gray-200); }
    .btn-outline:hover { border-color: #3b82f6; color: var(--blue); }

    .filter-wrap { display: flex; gap: 8px; align-items: center; }
    .filter-wrap label { font-size: 12px; font-weight: 600; color: var(--gray-600); }
    .filter-wrap select { padding: 8px 12px; border: 2px solid var(--gray-200); border-radius: 8px; font-family: inherit; font-size: 13px; color: var(--gray-800); outline: none; }
    .filter-wrap select:focus { border-color: #3b82f6; }

    .search-wrap { position: relative; }
    .search-wrap input { padding: 9px 12px 9px 36px; border: 2px solid var(--gray-200); border-radius: 8px; font-family: inherit; font-size: 13px; width: 200px; outline: none; }
    .search-wrap input:focus { border-color: #3b82f6; }
    .search-wrap::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; }

    /* ===== STATUS ===== */
    .status-bar { padding: 10px 24px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .status-bar.loading { background: #fef9c3; color: #a16207; }
    .status-bar.ok { background: #dcfce7; color: #166534; }
    .status-bar.error { background: #fee2e2; color: #991b1b; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .loading .dot { background: #ca8a04; animation: pulse 1s infinite; }
    .ok .dot { background: #16a34a; }
    .error .dot { background: #dc2626; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }

    /* ===== GRID QR ===== */
    .main { padding: 24px; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--gray-400); }
    .empty-state .icon { font-size: 56px; margin-bottom: 14px; }
    .empty-state p { font-size: 15px; }

    .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }

    .qr-card {
      background: white;
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1.5px solid var(--gray-200);
      transition: box-shadow .2s;
      page-break-inside: avoid;
    }
    .qr-card:hover { box-shadow: 0 8px 32px rgba(15,32,68,0.15); }

    .qr-card-header {
      width: 100%;
      background: linear-gradient(135deg, var(--navy), var(--navy-mid));
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qr-school-logo { font-size: 16px; }
    .qr-school-name { font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.85); line-height: 1.3; }
    .qr-school-name span { color: var(--gold-light); display: block; font-size: 8px; }

    .qr-foto-wrap { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; border: 3px solid white; box-shadow: 0 2px 8px rgba(15,32,68,0.2); margin-top: -20px; flex-shrink: 0; background: var(--gray-100); display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .qr-foto-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .qr-body { padding: 10px 14px 14px; text-align: center; width: 100%; }
    .qr-nama { font-size: 13px; font-weight: 800; color: var(--navy); margin-bottom: 2px; line-height: 1.2; }
    .qr-kelas { font-size: 11px; color: var(--gray-400); font-weight: 600; margin-bottom: 10px; }

    .qr-img-wrap { background: white; border: 2px solid var(--gray-200); border-radius: 12px; padding: 8px; display: inline-block; margin-bottom: 10px; }
    .qr-img-wrap img { display: block; width: 130px; height: 130px; }

    .qr-code-label { font-size: 10px; font-weight: 700; color: var(--blue); background: #eff6ff; padding: 4px 10px; border-radius: 20px; font-family: monospace; letter-spacing: 1px; margin-bottom: 8px; }
    .qr-penjemput { font-size: 10px; color: var(--gray-600); background: var(--gray-100); padding: 5px 10px; border-radius: 8px; width: 100%; text-align: left; line-height: 1.4; }
    .qr-penjemput strong { color: var(--navy); display: block; margin-bottom: 1px; }

    /* ===== PRINT ===== */
    @media print {
      header, .controls, .status-bar { display: none !important; }
      body { background: white; }
      .main { padding: 0; }
      .qr-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .qr-card { box-shadow: none; border: 1.5px solid #ccc; break-inside: avoid; }
      .btn-print, .btn-outline, .btn-primary { display: none; }
    }
  </style>
</head>
<body>

<header>
 <div class="school-logo"><img src="logo.png" style="width:36px;height:36px;object-fit:contain;border-radius:8px;"></div>
  <div class="header-info">
    <h1>Cetak QR Code Siswa</h1>
    <p>Aisyah Cendekia Islamic School — Makassar</p>
  </div>
</header>

<div class="status-bar loading" id="statusBar">
  <div class="dot"></div>
  <span id="statusText">Mengambil data dari Google Sheets...</span>
</div>

<div class="controls">
  <div class="controls-left">
    <div class="filter-wrap">
      <label>Kelas:</label>
      <select id="filterKelas" onchange="renderKartu()">
        <option value="">Semua Kelas</option>
      </select>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchNama" placeholder="Cari nama siswa..." oninput="renderKartu()">
    </div>
  </div>
  <button class="btn btn-outline" onclick="loadData()">🔄 Refresh</button>
  <button class="btn btn-print" onclick="window.print()">🖨️ Cetak / Simpan PDF</button>
</div>

<div class="main">
  <div id="konten">
    <div class="empty-state">
      <div class="icon">⏳</div>
      <p>Memuat data siswa...</p>
    </div>
  </div>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbw-qeQJ7IWf5NAnNVwec2_4PlV2Ra-GsJkSfc4fT23iFdNwU6YTinfAwIn4KvrTJsRb/exec";

let database = {};

function loadData() {
  const bar = document.getElementById('statusBar');
  const txt = document.getElementById('statusText');
  bar.className = 'status-bar loading';
  txt.textContent = 'Mengambil data dari Google Sheets...';

  fetch(SHEET_URL + "?t=" + Date.now())
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      database = data;
      const n = Object.keys(database).length;
      bar.className = 'status-bar ok';
      txt.textContent = '✓ ' + n + ' data siswa berhasil dimuat';
      isiFilterKelas();
      renderKartu();
    })
    .catch(() => {
      bar.className = 'status-bar error';
      txt.textContent = '✗ Gagal mengambil data. Periksa koneksi internet.';
      document.getElementById('konten').innerHTML = `
        <div class="empty-state">
          <div class="icon">❌</div>
          <p>Gagal memuat data dari Google Sheets.<br>Klik tombol Refresh untuk coba lagi.</p>
        </div>`;
    });
}

function isiFilterKelas() {
  const sel = document.getElementById('filterKelas');
  const kelas = [...new Set(Object.values(database).map(s => s.kelas))].sort();
  sel.innerHTML = '<option value="">Semua Kelas</option>' +
    kelas.map(k => `<option value="${k}">${k}</option>`).join('');
}

function renderKartu() {
  const konten = document.getElementById('konten');
  const keys = Object.keys(database);
  if (!keys.length) return;

  const filterKelas = document.getElementById('filterKelas').value;
  const cari = document.getElementById('searchNama').value.toLowerCase();

  const filtered = keys.filter(code => {
    const s = database[code];
    const cocokKelas = !filterKelas || s.kelas === filterKelas;
    const cocokNama = !cari || s.nama.toLowerCase().includes(cari) || code.toLowerCase().includes(cari);
    return cocokKelas && cocokNama;
  });

  if (!filtered.length) {
    konten.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>Siswa tidak ditemukan</p></div>`;
    return;
  }

  const qrBase = "https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=";

  konten.innerHTML = `<div class="qr-grid">` + filtered.map(code => {
    const s = database[code];
    const fotoHtml = (s.foto && s.foto.startsWith('http'))
      ? `<img src="${s.foto}" alt="${s.nama}" onerror="this.parentElement.innerHTML='${s.emoji||'👤'}';">`
      : (s.emoji || '👤');

    return `
      <div class="qr-card">
        <div class="qr-card-header">
          <div class="qr-school-logo"><img src="logo.png" style="width:18px;height:18px;object-fit:contain;border-radius:3px;"></div>
          <div class="qr-school-name">Aisyah Cendekia<span>Islamic School</span></div>
        </div>
        <div class="qr-foto-wrap">${fotoHtml}</div>
        <div class="qr-body">
          <div class="qr-nama">${s.nama}</div>
          <div class="qr-kelas">${s.kelas}</div>
          <div class="qr-img-wrap">
            <img src="${qrBase}${encodeURIComponent(code)}" alt="QR ${code}">
          </div>
          <div class="qr-code-label">${code}</div>
          <div class="qr-penjemput">
            <strong>Penjemput Sah:</strong>
            ${s.penjemput}
          </div>
        </div>
      </div>`;
  }).join('') + `</div>`;
}

loadData();
</script>
</body>
</html>
