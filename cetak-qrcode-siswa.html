<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cetak QR Code Siswa - Aisyah Cendekia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --navy: #0f2044; --navy-mid: #1a3460; --blue: #2563eb; --blue-light: #3b82f6;
      --gold: #f59e0b; --gold-light: #fcd34d; --green: #10b981; --green-bg: #d1fae5;
      --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
      --gray-400: #94a3b8; --gray-600: #475569; --gray-800: #1e293b;
      --radius: 16px; --shadow: 0 4px 24px rgba(15,32,68,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gray-50); color: var(--gray-800); }

    header { background: linear-gradient(135deg, var(--navy), var(--navy-mid)); color: white; position: relative; overflow: hidden; }
    header::before { content:''; position:absolute; top:-40px; right:-40px; width:200px; height:200px; background:rgba(245,158,11,0.12); border-radius:50%; }
    .header-inner { display:flex; align-items:center; gap:14px; padding:18px 20px; position:relative; z-index:1; }
    .school-logo { width:52px; height:52px; background:linear-gradient(135deg,var(--gold),var(--gold-light)); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0; box-shadow:0 4px 12px rgba(245,158,11,0.4); }
    .school-info h1 { font-size:15px; font-weight:800; line-height:1.2; }
    .school-info p { font-size:11px; color:rgba(255,255,255,0.65); font-style:italic; margin-top:2px; }

    /* DB STATUS */
    .db-status { display:flex; align-items:center; gap:8px; padding:10px 20px; font-size:12px; font-weight:600; }
    .db-status.loading { background:#fef9c3; color:#a16207; }
    .db-status.ok { background:#dcfce7; color:#166534; }
    .db-status.error { background:#fee2e2; color:#991b1b; }
    .db-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .db-status.loading .db-dot { background:#ca8a04; animation:pulse 1s infinite; }
    .db-status.ok .db-dot { background:#16a34a; }
    .db-status.error .db-dot { background:#dc2626; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }

    /* TOOLBAR */
    .toolbar { background: white; border-bottom: 1px solid var(--gray-200); padding: 14px 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .toolbar-title { font-size: 14px; font-weight: 700; color: var(--navy); flex: 1; }
    .btn { padding: 9px 16px; border-radius: 10px; border: none; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
    .btn-primary { background: linear-gradient(135deg, var(--blue), var(--blue-light)); color: white; box-shadow: 0 2px 8px rgba(37,99,235,0.3); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
    .btn-outline { background: white; color: var(--navy); border: 2px solid var(--gray-200); }
    .btn-outline:hover { border-color: var(--blue-light); color: var(--blue); }
    .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--navy); box-shadow: 0 2px 8px rgba(245,158,11,0.3); }
    .btn-gold:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: .4; cursor: default; transform: none !important; }

    /* MANUAL INPUT */
    .manual-section { background: white; border-bottom: 1px solid var(--gray-200); padding: 14px 20px; }
    .manual-title { font-size: 12px; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
    .manual-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .manual-row input { flex: 1; min-width: 120px; padding: 9px 12px; border: 2px solid var(--gray-200); border-radius: 10px; font-family: inherit; font-size: 13px; color: var(--gray-800); outline: none; transition: border-color .2s; }
    .manual-row input:focus { border-color: var(--blue-light); }

    /* GRID QR */
    .container { padding: 20px; max-width: 960px; margin: auto; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--gray-400); }
    .empty-icon { font-size: 56px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }
    .empty-state small { font-size: 12px; color: var(--gray-400); margin-top: 6px; display: block; }

    .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }

    .qr-card {
      background: white; border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 20px 16px; text-align: center; position: relative;
      transition: transform .2s, box-shadow .2s;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
    .qr-card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(15,32,68,0.15); }
    .qr-card .delete-btn { position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:50%; background:var(--gray-100); border:none; cursor:pointer; font-size:12px; color:var(--gray-400); display:flex; align-items:center; justify-content:center; transition:all .15s; }
    .qr-card .delete-btn:hover { background:#fee2e2; color:#dc2626; }
    .qr-canvas { margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; }
    .qr-canvas canvas, .qr-canvas img { border-radius: 8px; }
    .qr-kode { font-family: monospace; font-size: 11px; font-weight: 700; color: var(--blue); background: #eff6ff; padding: 3px 10px; border-radius: 20px; margin-bottom: 8px; display: inline-block; }
    .qr-nama { font-size: 14px; font-weight: 800; color: var(--navy); margin-bottom: 3px; line-height: 1.3; }
    .qr-kelas { font-size: 11px; color: var(--gray-400); font-weight: 500; margin-bottom: 3px; }
    .qr-penjemput { font-size: 11px; color: var(--gray-600); }
    .qr-school { font-size: 10px; color: var(--gray-400); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--gray-100); }

    /* PRINT */
    @media print {
      header, .toolbar, .manual-section, .db-status, .delete-btn { display: none !important; }
      body { background: white; }
      .container { padding: 10px; max-width: 100%; }
      .qr-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .qr-card { box-shadow: none; border: 1px solid #e2e8f0; break-inside: avoid; padding: 12px 10px; }
      .qr-card:hover { transform: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="school-logo">🕌</div>
    <div class="school-info">
      <h1>Cetak QR Code Siswa</h1>
      <p>Aisyah Cendekia Islamic School</p>
    </div>
  </div>
</header>

<div class="db-status loading" id="dbStatus">
  <div class="db-dot"></div>
  <span id="dbStatusText">Menghubungkan ke database Google Sheets...</span>
</div>

<div class="toolbar">
  <div class="toolbar-title" id="toolbarTitle">Memuat data...</div>
  <button class="btn btn-outline" onclick="loadDatabase()">🔄 Refresh</button>
  <button class="btn btn-gold" onclick="window.print()">🖨️ Cetak Semua</button>
</div>

<!-- INPUT MANUAL -->
<div class="manual-section">
  <div class="manual-title">➕ Tambah / Cari Siswa Manual</div>
  <div class="manual-row">
    <input type="text" id="inpKode" placeholder="Kode (cth: SISWA001)" />
    <input type="text" id="inpNama" placeholder="Nama Siswa" />
    <input type="text" id="inpKelas" placeholder="Kelas (cth: TK B)" />
    <input type="text" id="inpPenjemput" placeholder="Nama Penjemput" />
    <button class="btn btn-primary" onclick="tambahManual()">+ Tambah QR</button>
  </div>
</div>

<div class="container">
  <div id="qrGrid" class="qr-grid"></div>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbw-qeQJ7IWf5NAnNVwec2_4PlV2Ra-GsJkSfc4fT23iFdNwU6YTinfAwIn4KvrTJsRb/exec";
let siswaList = [];

function loadDatabase() {
  const el = document.getElementById('dbStatus');
  const txt = document.getElementById('dbStatusText');
  el.className = 'db-status loading';
  txt.textContent = 'Menghubungkan ke Google Sheets...';

  fetch(SHEET_URL + "?t=" + Date.now())
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      siswaList = Object.entries(data).map(([kode, s]) => ({
        kode, nama: s.nama, kelas: s.kelas, penjemput: s.penjemput, emoji: s.emoji || '👤'
      }));
      el.className = 'db-status ok';
      txt.textContent = '✓ Terhubung — ' + siswaList.length + ' siswa berhasil dimuat';
      document.getElementById('toolbarTitle').textContent = siswaList.length + ' QR Code siap cetak';
      renderAll();
    })
    .catch(() => {
      el.className = 'db-status error';
      txt.textContent = '✗ Gagal terhubung. Tambah data manual di bawah.';
      document.getElementById('toolbarTitle').textContent = 'Gagal memuat — gunakan input manual';
      document.getElementById('qrGrid').innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="empty-icon">⚠️</div>
          <p>Tidak bisa terhubung ke Google Sheets</p>
          <small>Tambah siswa manual menggunakan form di atas, atau klik Refresh jika koneksi sudah tersedia.</small>
        </div>`;
    });
}

function renderAll() {
  const grid = document.getElementById('qrGrid');
  if (!siswaList.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📭</div><p>Belum ada data siswa</p><small>Tambahkan data di Google Sheets atau gunakan input manual di atas.</small></div>`;
    return;
  }
  grid.innerHTML = '';
  siswaList.forEach((s, i) => buatKartu(s, i));
}

function buatKartu(s, idx) {
  const grid = document.getElementById('qrGrid');
  const card = document.createElement('div');
  card.className = 'qr-card';
  card.id = 'card-' + idx;
  card.innerHTML = `
    <button class="delete-btn" onclick="hapus(${idx})" title="Hapus">✕</button>
    <div class="qr-canvas" id="qr-${idx}"></div>
    <div class="qr-kode">${s.kode}</div>
    <div class="qr-nama">${s.emoji} ${s.nama}</div>
    <div class="qr-kelas">${s.kelas}</div>
    <div class="qr-penjemput">Penjemput: ${s.penjemput}</div>
    <div class="qr-school">Aisyah Cendekia Islamic School</div>
  `;
  grid.appendChild(card);

  // Generate QR
  new QRCode(document.getElementById('qr-' + idx), {
    text: s.kode,
    width: 140,
    height: 140,
    colorDark: '#0f2044',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
}

function hapus(idx) {
  siswaList.splice(idx, 1);
  document.getElementById('toolbarTitle').textContent = siswaList.length + ' QR Code siap cetak';
  // Re-render ulang semua
  const grid = document.getElementById('qrGrid');
  grid.innerHTML = '';
  siswaList.forEach((s, i) => buatKartu(s, i));
}

function tambahManual() {
  const kode = document.getElementById('inpKode').value.trim().toUpperCase();
  const nama = document.getElementById('inpNama').value.trim();
  const kelas = document.getElementById('inpKelas').value.trim();
  const penjemput = document.getElementById('inpPenjemput').value.trim();

  if (!kode || !nama) { alert('Kode dan Nama wajib diisi!'); return; }

  const idx = siswaList.length;
  siswaList.push({ kode, nama, kelas: kelas||'-', penjemput: penjemput||'-', emoji: '👤' });
  buatKartu(siswaList[idx], idx);

  document.getElementById('toolbarTitle').textContent = siswaList.length + ' QR Code siap cetak';
  document.getElementById('inpKode').value = '';
  document.getElementById('inpNama').value = '';
  document.getElementById('inpKelas').value = '';
  document.getElementById('inpPenjemput').value = '';

  // Scroll ke kartu baru
  setTimeout(() => document.getElementById('card-' + idx)?.scrollIntoView({behavior:'smooth', block:'center'}), 200);
}

loadDatabase();
</script>
</body>
</html>
